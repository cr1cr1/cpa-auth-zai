#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27"
golangci-lint = "2.15"
goreleaser = "2.19"
zig = "0.17.0"

[env]
# Default caches are read-only on some container hosts.
GOCACHE = "${MISE_PROJECT_ROOT:-/}tmp/cpa-auth-zai-gocache"
GOMODCACHE = "${MISE_PROJECT_ROOT:-/}tmp/cpa-auth-zai-gomod"
GOFLAGS = "-mod=vendor"

[tasks.test]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = "gofmt -w *.go"

[tasks.build]
run = """
set -e
goreleaser build --clean --snapshot --single-target
"""

[tasks.install]
description = "Install the current-platform GoReleaser plugin (set CPA_PLUGIN_DIR=...)"
run = """
set -eu
: "${CPA_PLUGIN_DIR:?set CPA_PLUGIN_DIR}"
os="$(go env GOOS)"
arch="$(go env GOARCH)"
case "$os" in
  linux) ext=so ;;
  darwin) ext=dylib ;;
  windows) ext=dll ;;
  *) echo "unsupported platform: $os" >&2; exit 1 ;;
esac
set -- dist/plugin_"${os}"_"${arch}"_*/cpa-auth-zai-v*-"${os}"-"${arch}"."${ext}"
if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
  echo "expected one $os/$arch plugin in dist; run mise run build" >&2
  exit 1
fi
cp "$1" "${CPA_PLUGIN_DIR}/cpa-auth-zai.${ext}"
"""

[tasks.clean]
run = "rm -rf dist"
