version: 2
project_name: cpa-auth-zai
archives:
  - strip_binary_directory: true
    formats: zip
    files:
      - README.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
builds:
  - id: plugin
    binary: cpa-auth-zai-v{{ .Version }}-{{ .Os }}-{{ .Arch }}
    buildmode: c-shared
    env:
      - CGO_ENABLED=1
      - >-
        {{- if eq .Os "linux" }}
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-linux-gnu -lc{{ end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-linux-gnu -lc{{ end }}
        {{- else if eq .Os "darwin" }}
        {{- if eq .Arch "amd64" }}CC=clang -arch x86_64{{ end }}
        {{- if eq .Arch "arm64" }}CC=clang -arch arm64{{ end }}
        {{- else if eq .Os "windows" }}
        {{- if eq .Arch "amd64" }}CC=zig cc -target x86_64-windows-gnu -lc{{ end }}
        {{- if eq .Arch "arm64" }}CC=zig cc -target aarch64-windows-gnu -lc{{ end }}
        {{- end }}
      - >-
        {{- if eq .Os "linux" }}
        {{- if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-linux-gnu -lc{{ end }}
        {{- if eq .Arch "arm64" }}CXX=zig c++ -target aarch64-linux-gnu -lc{{ end }}
        {{- else if eq .Os "darwin" }}
        {{- if eq .Arch "amd64" }}CXX=clang++ -arch x86_64{{ end }}
        {{- if eq .Arch "arm64" }}CXX=clang++ -arch arm64{{ end }}
        {{- else if eq .Os "windows" }}
        {{- if eq .Arch "amd64" }}CXX=zig c++ -target x86_64-windows-gnu -lc{{ end }}
        {{- if eq .Arch "arm64" }}CXX=zig c++ -target aarch64-windows-gnu -lc{{ end }}
        {{- end }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -mod=vendor
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.pluginVersion={{ .Version }}
checksum:
  name_template: "checksums.txt"
  algorithm: sha256
snapshot:
  version_template: "{{ .Version }}-next"
