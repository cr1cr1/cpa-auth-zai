#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27"
golangci-lint = "2.15"

[env]
# Default caches are read-only on some container hosts.
GOCACHE = "tmp/cpa-auth-zai-gocache"
GOMODCACHE = "tmp/cpa-auth-zai-gomod"
GOFLAGS = "-mod=vendor"

[tasks.test]
run = "go test -race ./..."

[tasks.lint]
run = "golangci-lint run"

[tasks.fmt]
run = "gofmt -w *.go"

[tasks.build]
run = """
set -e
CGO_ENABLED=1 go build -buildmode=c-shared -o dist/cpa-auth-zai.so .
rm -f dist/cpa-auth-zai.h
"""

[tasks.install]
description = "Copy the plugin .so into the CPA plugins directory (set CPA_PLUGIN_DIR=...)"
run = "set -euo pipefail; install -m 0755 dist/cpa-auth-zai.so \"${CPA_PLUGIN_DIR}/\""

[tasks.clean]
run = "rm -rf dist"
